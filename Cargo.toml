[package]
name = "rill"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1.0"
clang-sys = { version = "=1.8.1", optional = true, features = ["runtime", "clang_12_0"] }
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191" }

[features]
default = ["c-import"]
c-import = ["dep:clang-sys"]
